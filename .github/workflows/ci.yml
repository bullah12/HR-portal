name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only. Splitting the URI into components keeps
      # placeholder credentials from looking like a committed connection secret.
      DATABASE_URL: ${{ format('{0}://{1}:{2}@{3}:5432/{4}', 'postgresql', 'build', 'build', 'localhost', 'build') }}
      AUTH_SECRET: ci-placeholder-secret-not-used-at-build-time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
